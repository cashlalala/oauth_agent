# Place in the nginx server block for dev-auth.mediatek.inc (TLS terminated there).
# Trailing slashes make nginx strip the /a2a prefix: /a2a/ -> /, /a2a/.well-known/... -> /.well-known/...
location = /a2a { return 301 /a2a/; }

location /a2a/ {
    proxy_pass http://1.2.3.4/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    # SSE (message/stream): no buffering, long reads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
